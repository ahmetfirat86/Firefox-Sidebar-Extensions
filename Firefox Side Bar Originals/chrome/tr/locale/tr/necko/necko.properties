RepostFormData = Bu sayfa başka bir konuma yönlendiriliyor. Yazdığınız form verisini yeni konuma da göndermek ister misiniz?
DirTitle = %1$S dizini
DirGoUp = Üst düzeydeki klasöre git
ShowHidden = Gizli nesneleri göster
DirColName = İsim
DirColSize = Boyut
DirColMTime = Son değişiklik
DirFileLabel = Dosya:
TrackerUriBlockedByETP = Gelişmiş izlenme koruması etkin olduğu için “%1$S” adresindeki kaynak engellendi.
UnsafeUriBlocked = “%1$S” konumundaki kaynak, Safe Browsing tarafından engellendi.
StrictUrlProtocolSetter = “%1$S“ adresinin “%2$S“ protokolüne geçişi engellendi.
CORPBlocked = “%1$S” adresindeki kaynak, Cross-Origin-Resource-Policy üst bilgisi nedeniyle (veya bu üst bilgi olmadığı için) engellendi. Bkz. %2$S
CookieBlockedByPermission = Özel çerez izni nedeniyle “%1$S” çerezlerine erişme veya çerez depolama isteği engellendi.
CookieBlockedTrackerByETP = “%1$S” çerezlerine erişme veya çerez depolama isteği bir takip kodundan geldiği ve gelişmiş izlenme koruması açık olduğu için engellendi.
CookieBlockedAll = Tüm depolama erişimi isteklerini engellediğimiz için “%1$S” çerezlerine erişme veya çerez depolama isteği engellendi.
CookieBlockedForeignByETP = Üçüncü taraflardan gelen tüm depolama erişimi isteklerini engellediğimiz ve gelişmiş izlenme koruması açık olduğu için “%1$S” çerezlerine erişme veya çerez depolama isteği engellendi.
CookiePartitionedForeign2 = Üçüncü taraf bağlamında yüklendiği ve dinamik durum bölümleme etkin olduğu için “%1$S” sitesine bölümlenmiş çerez veya depolama erişimi sağlandı.
CookieAllowedForOriginByStorageAccessAPI = “%2$S” kökeni için “%1$S” üzerinde açılan depolama erişimine izin verildi.
CookieAllowedForOriginByHeuristic = “%2$S” kökeni için “%1$S” üzerinde açılan depolama erişimine otomatik olarak izin verildi.
CookieAllowedForDFPIByHeuristic = “%2$S” dinamik durum bölümlemesi için “%1$S” üzerinde açılan depolama erişimine otomatik olarak izin verildi.
CookieRejectedNonRequiresSecure2 = “%1$S” çerezinde “SameSite=None” özniteliği olmasına rağmen “secure” özniteliği olmadığı için çerez reddedildi.
CookieRejectedNonRequiresSecureForBeta3 = “%1$S” çerezinin “SameSite” özniteliği “None” olarak ayarlandığından ve “secure” özniteliği olmadığından, bu çerez yakında reddedilmeye başlanacak. “SameSite“ özniteliği hakkında daha fazla bilgi için %2$S sayfasını okuyabilirsiniz.
CookieLaxForced2 = “%1$S” çerezinin “SameSite” ilkesi “Lax” olarak ayarlandı çünkü çerezin “SameSite” özniteliği yok ve bu özniteliğin varsayılan değeri “SameSite=Lax”.
CookieLaxForcedForBeta2 = “%1$S” çerezinin uygun bir “SameSite” öznitelik değeri yok. Yakında “SameSite” özelliği olmayan ya da geçersiz bir değere sahip olan çerezler “Lax” olarak değerlendirilecektir. Bu, çerezin artık üçüncü taraf bağlamlarında gönderilemeyeceği anlamına gelir. Uygulamanız çerezin bu bağlamlarda kullanılabilir olmasını gerektiriyorsa lütfen “SameSite=None“ özniteliğini ekleyin. “SameSite“ özniteliği hakkında daha fazla bilgi için %2$S adresine bakabilirsiniz.
CookieSameSiteValueInvalid2 = “%1$S” çerezi için geçersiz “SameSite“ değeri. Desteklenen değerler: “Lax“, “Strict“, “None“.
CookieInvalidMaxAgeAttribute = “%1$S” çerezi için geçersiz “max-age“ değeri. Öznitelik görmezden gelindi.
CookieOversize = “%1$S” çerezi geçersiz çünkü boyutu çok büyük. Maksimum boyut %2$S bayttır.
CookieRejectedByPermissionManager = Kullanıcının kısıtladığı izinler nedeniyle “%1$S” çerezi reddedildi.
CookieRejectedEmptyNameAndValue = Adı ve değeri boş olan çerez reddedildi.
CookieRejectedInvalidCharName = Adındaki geçersiz karakterler nedeniyle “%1$S” çerezi reddedildi.
CookieRejectedInvalidCharAttributes = Özniteliklerdeki geçersiz karakterler nedeniyle “%1$S” çerezi reddedildi.
CookieRejectedInvalidDomain = Alan adı geçersiz olduğu için “%1$S” çerezi reddedildi.
CookieRejectedInvalidPrefix = Ön eki geçersiz olduğu için “%1$S” çerezi reddedildi.
CookieRejectedInvalidPath = Yolu geçersiz olduğu için “%1$S” çerezi reddedildi.
CookieRejectedInvalidCharValue = Değerindeki geçersiz karakterler nedeniyle “%1$S” çerezi reddedildi.
CookieRejectedAttributePathOversize = path özniteliği çok büyük olduğu için “%1$S” çerezi reddedildi.
CookieRejectedAttributeDomainOversize = domain özniteliği çok büyük olduğu için “%1$S” çerezi reddedildi.
CookieRejectedAttributeExpiryOversize = Geçerlilik tarihi sınırı aştığından “%1$S” çerezi reddedildi.
CookieRejectedHttpOnlyButFromScript = HTTP-Only bir çerez zaten bulunmasına rağmen betik yeni bir çerez depolamaya çalıştığı için “%1$S” çerezi reddedildi.
CookieRejectedSecureButNonHttps = HTTPS olmayan çerezler sadece “secure” olarak ayarlanabileceği için “%1$S” çerezi reddedildi.
CookieRejectedThirdParty = Üçüncü taraf “%1$S” çerezi reddedildi.
CookieRejectedNonsecureOverSecure = Mevcut bir “secure” çerez bulunduğu için “%1$S” çerezi reddedildi.
CookieRejectedForNonSameSiteness = “SameSite” özniteliği “Lax” veya “Strict” olmasına rağmen siteler arası bağlamda bulunan “%1$S” çerezi reddedildi.
CookieRejectedPartitionedRequiresSecure = “%1$S” çerezinde “Partitioned” özniteliği olmasına rağmen “secure” özniteliği olmadığı için çerez reddedildi.
CookieAttributeIgnored = “%1$S” çerezi için “%2$S” özniteliğinin değeri, boyutu çok büyük olduğu için reddedildi. Maksimum boyut %3$S bayttır.
CookieAttributeOverwritten = “%1$S” çerezinin “%2$S” öznitelik değerinin üzerine yazıldı.
CookieForeignNoPartitionedWarning = “%1$S” çerezi yabancı olduğu için ve “Partitioned” özniteliğine sahip olmadığı için yakında reddedilecektir.
CookieForeignNoPartitionedError = “%1$S” çerezi yabancı olduğu için ve “Partitioned” özniteliğine sahip olmadığı için reddedildi.
CookieBlockedCrossSiteRedirect = “SameSite” öznitelik değeri “Lax” veya “Strict” olan “%1$S” çerezi, siteler arası yönlendirme nedeniyle atlandı.
APIDeprecationWarning = Uyarı: ‘%1$S’ kullanımdan kaldırıldı. Lütfen ‘%2$S’ kullanın.
ResourceBlockedORB = “%1$S” konumundaki kaynak, OpaqueResponseBlocking tarafından engellendi. Sebep: “%2$S”.
InvalidHTTPResponseStatusLine = HTTP yanıtının durum satırı geçersiz
LocalNetworkAccessDetected = Yerel ağ erişimi algılandı: üst düzey site “%1$S”, başlatan “%2$S”, %6$S üzerinden “%3$S” (%4$S:%5$S) hedefine erişiyor. Güvenli bağlam: %7$S, komut istemi: %8$S
LocalNetworkAccessPermissionRequired = Yerel ağ erişimi için izin gerekli: üst düzey site “%1$S”, başlatan “%2$S”, %6$S üzerinden “%3$S” (%4$S:%5$S) hedefine erişilecek. Güvenli bağlam: %7$S
