CSPInlineStyleViolation2 = Sayfa ayarları şu direktifi ihlal eden bir satır içi stilin (%2$S) uygulanmasını engelledi: “%1$S”. Bir hash ('sha256-%3$S', stil öznitelikleri için 'unsafe-hashes' gerektirir) veya nonce kullanmayı düşünün.
CSPROInlineStyleViolation2 = (Report-Only ilkesi) Sayfa ayarları şu direktifi ihlal eden bir satır içi stilin (%2$S) uygulanmasını engelleyecek: “%1$S”. Bir hash ('sha256-%3$S', stil öznitelikleri için 'unsafe-hashes' gerektirir) veya nonce kullanmayı düşünün.
CSPInlineScriptViolation2 = Sayfa ayarları şu direktifi ihlal eden bir satır içi betiğin (%2$S) yürütülmesini engelledi: “%1$S”. Bir hash ('sha256-%3$S') veya nonce kullanmayı düşünün.
CSPROInlineScriptViolation2 = (Report-Only ilkesi) Sayfa ayarları şu direktifi ihlal eden bir satır içi betiğin (%2$S) yürütülmesini engelleyecek: “%1$S”. Bir hash ('sha256-%3$S') veya nonce kullanmayı düşünün.
CSPEventHandlerScriptViolation2 = Sayfa ayarları, aşağıdaki direktifi ihlal eden bir olay işleyicinin (%2$S) çalıştırılmasını engelledi: “%1$S”. 'unsafe-hashes' ile birlikte bir hash ('sha256-%3$S') kullanmayı düşünün.
CSPROEventHandlerScriptViolation2 = (Report-Only ilkesi) Sayfa ayarları, aşağıdaki direktifi ihlal eden bir olay işleyicinin (%2$S) çalıştırılmasını engelleyecek: “%1$S”. 'unsafe-hashes' ile birlikte bir hash ('sha256-%3$S') kullanmayı düşünün.
CSPEvalScriptViolation = Sayfa ayarları şu direktifi ihlal eden bir JavaScript eval kullanımının (%2$S) yürütülmesini engelledi: “%1$S” ('unsafe-eval' eksik)
CSPROEvalScriptViolation = (Report-Only ilkesi) Sayfa ayarları şu direktifi ihlal eden JavaScript eval kullanımının (%2$S) yürütülmesini engelleyecek: “%1$S” ('unsafe-eval' eksik)
CSPWasmEvalScriptViolation = Sayfa ayarları şu direktifi ihlal eden WebAssembly’nin (%2$S) yürütülmesini engelledi: “%1$S” ('wasm-unsafe-eval' veya 'unsafe-eval' eksik)
CSPROWasmEvalScriptViolation = (Report-Only ilkesi) Sayfa ayarları şu direktifi ihlal eden WebAssembly’nin (%2$S) yürütülmesini engelleyecek: “%1$S” ('wasm-unsafe-eval' veya 'unsafe-eval' eksik)
CSPTrustedTypesPolicyViolation = Sayfa ayarları şu direktifi ihlal eden Trusted Types ilkesinin oluşturulmasını engelledi: “%1$S“
CSPROTrustedTypesPolicyViolation = (Report-Only ilkesi) Sayfa ayarları şu direktifi ihlal eden Trusted Types ilkesinin oluşturulmasını engelleyecek: “%1$S“
CSPTrustedTypesSinkViolation = Sayfa ayarları şu direktifi ihlal eden injection sink’e atamayı engelledi: “require-trusted-types-for ’script’“
CSPROTrustedTypesSinkViolation = (Report-Only ilkesi) Sayfa ayarları şu direktifi ihlal eden injection sink’e atamayı engelleyecek: “require-trusted-types-for ’script’“
CSPStyleViolation = %2$S kaynağındaki bir stil (%3$S) şu direktifi ihlal ettiği için sayfa ayarları bu stilin uygulanmasını engelledi: “%1$S”
CSPROStyleViolation = (Report-Only ilkesi) Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için %2$S kaynağındaki bir stilin (%3$S) uygulanmasını engelleyecek: “%1$S”
CSPScriptViolation = Sayfa ayarları şu direktifi ihlal eden %2$S kaynağındaki bir betiğin (%3$S) yürütülmesini engelledi: “%1$S”
CSPROScriptViolation = (Report-Only ilkesi) %2$S kaynağındaki bir betik (%3$S) şu direktifi ihlal ettiği için sayfa ayarları betiğin yürütülmesini engelleyecek: “%1$S”
CSPWorkerViolation = (Report-Only ilkesi) %2$S kaynağındaki bir worker betiği (%3$S) şu direktifi ihlal ettiği için sayfa ayarları betiğin yürütülmesini engelledi: “%1$S”
CSPROWorkerViolation = (Report-Only ilkesi) %2$S kaynağındaki bir worker betiği (%3$S) şu direktifi ihlal ettiği için sayfa ayarları worker betiğinin yürütülmesini engelleyecek: “%1$S”
CSPGenericViolation = Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için %2$S adresindeki bir kaynağın (%3$S) yüklenmesini engelledi: “%1$S”
CSPROGenericViolation = (Report-Only ilkesi) Sayfa ayarları şu direktifi ihlal eden %2$S adresindeki bir kaynağın (%3$S) yüklenmesini engelleyecek: “%1$S”
triedToSendReport = Geçersiz URI’ye rapor gönderilmeye çalışıldı: “%1$S”
tooManyReports = Kısa bir süre içinde çok fazla CSP raporunun gönderilmesi engellendi.
couldNotParseReportURI = rapor URI’si işlenemedi: %1$S
couldNotProcessUnknownDirective = Bilinmeyen ‘%1$S’ direktifi işlenemedi
ignoringUnknownOption = Bilinmeyen %1$S seçeneği görmezden geliniyor
ignoringDuplicateSrc = Çift kaynak olan %1$S görmezden geliniyor
ignoringInvalidToken = Jeton geçersiz ‘%2$S’ karakterlerini içerdiği için ‘%1$S’ direktifi görmezden geliniyor
ignoringSrcFromMetaCSP = ‘%1$S’ kaynağı görmezden geliniyor. (meta elemanı aracılığıyla aktarıldığında desteklenmiyor.)
ignoringSrcWithinNonceOrHashDirective = %2$S içindeki “%1$S” yok sayılıyor: nonce-source veya hash-source belirtildi
ignoringScriptSrcForStrictDynamic = %2$S içindeki “%1$S” yok sayılıyor: ‘strict-dynamic’ belirtildi
ignoringStrictDynamic = “%1$S” kaynağı görmezden geliniyor. (Yalnızca script-src içinde destekleniyor.)
ignoringUnsafeEval = “%1$S” içindeki ‘unsafe-eval’ veya ‘wasm-unsafe-eval’ yok sayılıyor.
strictDynamicButNoHashOrNonce = “%1$S” içinde geçerli bir nonce veya hash’i olmayan ‘strict-dynamic’ anahtar kelimesi tüm betiklerin yüklenmesini engelleyebilir
reportURInotHttpsOrHttp2 = Rapor URI’si (%1$S) HTTP veya HTTPS URI olmalıdır.
reportURINorReportToNotInReportOnlyHeader = Bu sitenin (%1$S) report-uri direktifi veya report-to direktifi olmayan bir Report-Only ilkesi var. CSP bu ilkenin ihlallerini engelleyemez ve raporlayamaz.
failedToParseUnrecognizedSource = Tanınmayan %1$S kaynağının işlenmesi başarısız oldu
upgradeInsecureRequest = Güvensiz ‘%1$S’ isteği ‘%2$S’ kullanmak üzere yükseltiliyor
ignoreSrcForDirective = ‘%1$S’ direktifi için srcs görmezden geliniyor
hostNameMightBeKeyword = %1$S anahtar kelime olarak değil, ana bilgisayar adı olarak yorumlanıyor. Bunun anahtar kelime olmasını istediyseniz ‘%2$S’ (tek tırnak içinde) kullanın.
notSupportingDirective = ‘%1$S’ direktifi desteklenmiyor. Direktif ve değerler görmezden gelinecek.
blockAllMixedContent = Güvensiz ‘%1$S’ isteği engelleniyor.
ignoringDirectiveWithNoValues = Hiçbir parametre içermediği için ‘%1$S’ görmezden geliniyor.
ignoringInvalidGroupSyntax = Geçersiz ‘%2$S’ jetonuna sahip report-to direktif grubu ‘%1$S’ görmezden geliniyor.
ignoringReportOnlyDirective = ‘%1$S’ report-only ilkesiyle teslim edildiği için sandbox direktifi görmezden geliniyor
IgnoringSrcBecauseOfDirective = ‘%2$S’ direktifi nedeniyle ‘%1$S’ görmezden geliniyor.
IgnoringSourceWithinDirective = “%1$S” kaynağı görmezden geliniyor. (‘%2$S’ içinde desteklenmiyor.)
obsoleteBlockAllMixedContent = Karma içerik görüntüleme yükseltmesi nedeniyle block-all-mixed-content geçersiz hale geldiği için ‘%1$S’ yok sayılıyor.
couldntParseInvalidSource = Geçersiz %1$S kaynağı işlenemedi
couldntParseInvalidHost = Geçersiz %1$S sunucusu işlenemedi
couldntParsePort = %1$S portu işlenemedi
duplicateDirective = Birden fazla %1$S direktifi tespit edildi.  İlki dışındaki tüm direktifler görmezden gelinecek.
couldntParseInvalidSandboxFlag = Geçersiz sandbox bayrağı ‘%1$S’ işlenemedi
invalidNumberOfTrustedTypesForDirectiveValues = ‘require-trusted-types-for‘ direktifi için geçersiz sayıda jeton alındı: %1$S. 1 jeton bekleniyordu
invalidRequireTrustedTypesForDirectiveValue = ‘require-trusted-types-for‘ direktifi için geçersiz bir jeton alındı: %1$S. ‘script‘ jetonu bekleniyordu
invalidTrustedTypesExpression = ‘trusted-types’ direktifi için geçersiz bir jeton alındı: %1$S
CSPMessagePrefix = Content-Security-Policy: %S
